name: Worklow Triggers Demo

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      greeting:
        description: Message to print
        required: true
        default: Hello from a manual run
        type: string
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'America/Chicago'
  repository_dispatch:
    types: [say-hello]

permissions:
  contents: read

jobs:

  explain:
    name: Explain this run
    runs-on: ubuntu-latest

    steps:
      - name: Show what started this run
        env:
          EVENT_NAME: ${{github.event_name}}
          REF: ${{github.ref}}
        run: |
          printf 'Event %s\n' "$EVENT_NAME"
          printf 'Ref: %s\n' "$REF"

      - name: Show manual greeting
        if: github.event_name == 'workflow_dispatch'
        env:
          GREETING: ${{inputs.greeting}}
        run: printf '%s\n' "$GREETING"

      - name: Show custom event greeting
        if: github.event_name == 'repository_dispatch'
        env:
          GREETING: ${{github.event.client_payload.greeting}}
        run: printf '%s\n' "$GREETING"
